name: Review the living world
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - run: node scripts/simulate-century.mjs
      - run: node scripts/simulate-commerce-century.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-review-build
          path: dist
          retention-days: 14
